
def root = project.rootDir.absolutePath
def src = "${root}/app/src/main"

generateSources.doLast {
    new File("${src}/java/com/aiassistant/app/MainActivity.java") << '''
    private void transcribeAndRespond(byte[] wav, String aKey, String gKey) {
        try {
            OkHttpClient client = new OkHttpClient.Builder()
                .connectTimeout(30, java.util.concurrent.TimeUnit.SECONDS)
                .readTimeout(60, java.util.concurrent.TimeUnit.SECONDS)
                .build();

            Response upR = client.newCall(new Request.Builder()
                .url("https://api.assemblyai.com/v2/upload")
                .header("authorization", aKey)
                .post(RequestBody.create(wav, MediaType.parse("audio/wav")))
                .build()).execute();

            String upRaw = upR.body() != null ? upR.body().string() : "";
            if (!upR.isSuccessful()) {
                saveError("Upload: " + upRaw);
                handler.post(() -> tvStatus.setText("Ошибка загрузки"));
                return;
            }

            String upUrl = new JSONObject(upRaw).getString("upload_url");

            JSONObject tj = new JSONObject();
            tj.put("audio_url", upUrl);
            tj.put("language_code", "ru");

            Response tR = client.newCall(new Request.Builder()
                .url("https://api.assemblyai.com/v2/transcript")
                .header("authorization", aKey)
                .post(RequestBody.create(
                    tj.toString(),
                    MediaType.parse("application/json")))
                .build()).execute();

            String tRaw = tR.body() != null ? tR.body().string() : "";
            if (!tR.isSuccessful()) {
                saveError("STT: " + tRaw);
                handler.post(() -> tvStatus.setText("Ошибка распознавания"));
                return;
            }

            String tid = new JSONObject(tRaw).getString("id");
            String recognizedText = "";

            for (int i = 0; i < 30; i++) {
                Thread.sleep(2000);

                Response pR = client.newCall(new Request.Builder()
                    .url("https://api.assemblyai.com/v2/transcript/" + tid)
                    .header("authorization", aKey)
                    .get()
                    .build()).execute();

                String pRaw = pR.body() != null ? pR.body().string() : "";
                pR.close();

                JSONObject pJ = new JSONObject(pRaw);
                String status = pJ.getString("status");

                if ("completed".equals(status)) {
                    recognizedText = pJ.optString("text", "");
                    break;
                } else if ("error".equals(status)) {
                    saveError("STT: " + pJ.optString("error", ""));
                    break;
                }
            }

            final String question = recognizedText;
            handler.post(() -> tvTranscript.setText(question));

            if (question.trim().isEmpty()) {
                handler.post(() -> {
                    tvStatus.setText("Не удалось распознать речь");
                    tvStatus.setTextColor(getColor(R.color.status_idle));
                });
                return;
            }

            SharedPreferences prefs =
                getSharedPreferences("ai_prefs", MODE_PRIVATE);

            JSONObject requestJson = new JSONObject();
            requestJson.put(
                "model",
                prefs.getString("groq_model", "openai/gpt-oss-20b")
            );

            org.json.JSONArray messages = new org.json.JSONArray();

            JSONObject systemMessage = new JSONObject();
            systemMessage.put("role", "system");
            systemMessage.put(
                "content",
                prefs.getString(
                    "system_prompt",
                    "Ты голосовой ИИ-ассистент. Отвечай кратко по-русски."
                )
            );
            messages.put(systemMessage);

            JSONObject userMessage = new JSONObject();
            userMessage.put("role", "user");
            userMessage.put("content", question);
            messages.put(userMessage);

            requestJson.put("messages", messages);

            Response gR = client.newCall(new Request.Builder()
                .url("https://api.groq.com/openai/v1/chat/completions")
                .header(
                    "Authorization",
                    "Bearer " + prefs.getString("groq_key", "")
                )
                .post(RequestBody.create(
                    requestJson.toString(),
                    MediaType.parse("application/json")))
                .build()).execute();

            String gRaw = gR.body() != null ? gR.body().string() : "";

            if (!gR.isSuccessful()) {
                saveError("Groq: " + gRaw);
                handler.post(() -> tvStatus.setText("Ошибка Groq"));
                return;
            }

            String answer = new JSONObject(gRaw)
                .getJSONArray("choices")
                .getJSONObject(0)
                .getJSONObject("message")
                .getString("content");

            saveError("OK");

            handler.post(() -> {
                tvResponse.setText(answer);
                tvStatus.setText("Создаю голос...");
                tvStatus.setTextColor(getColor(R.color.status_speaking));
                speak(answer);
            });

        } catch (Exception e) {
            saveError(e.getClass().getSimpleName() + ": " + e.getMessage());
            handler.post(() ->
                Toast.makeText(
                    this,
                    "Ошибка: " + e.getMessage(),
                    Toast.LENGTH_LONG
                ).show()
            );
        }
    }

    private android.media.MediaPlayer ttsPlayer;

    private void speak(String text) {
        SharedPreferences prefs =
            getSharedPreferences("ai_prefs", MODE_PRIVATE);

        String apiKey = prefs.getString("freetts_key", "").trim();

        if (apiKey.isEmpty()) {
            tvStatus.setText("Добавь FreeTTS API-ключ в настройки");
            return;
        }

        executor.execute(() -> {
            java.io.File audioFile = null;

            try {
                OkHttpClient client = new OkHttpClient.Builder()
                    .connectTimeout(20, java.util.concurrent.TimeUnit.SECONDS)
                    .readTimeout(60, java.util.concurrent.TimeUnit.SECONDS)
                    .build();

                JSONObject body = new JSONObject();
                body.put("text", text);
                body.put("voice", "ru-RU-DmitryNeural");
                body.put("rate", "+0%");
                body.put("pitch", "+0Hz");

                Response synth = client.newCall(new Request.Builder()
                    .url("https://freetts.org/api/v1/tts")
                    .header("x-api-key", apiKey)
                    .post(RequestBody.create(
                        body.toString(),
                        MediaType.parse("application/json")))
                    .build()).execute();

                String responseText = synth.body() != null
                    ? synth.body().string() : "";
                int responseCode = synth.code();
                synth.close();

                if (responseCode < 200 || responseCode >= 300) {
                    saveError("FreeTTS HTTP " + responseCode + ": "
                        + responseText);
                    handler.post(() ->
                        tvStatus.setText("Ошибка FreeTTS: " + responseCode));
                    return;
                }

                String fileId =
                    new JSONObject(responseText).getString("file_id");

                Response audio = client.newCall(new Request.Builder()
                    .url("https://freetts.org/api/audio/" + fileId)
                    .get()
                    .build()).execute();

                if (!audio.isSuccessful() || audio.body() == null) {
                    int code = audio.code();
                    audio.close();
                    throw new Exception("Ошибка загрузки MP3: " + code);
                }

                audioFile = new java.io.File(
                    getCacheDir(), "freetts_reply.mp3");

                try (java.io.InputStream in = audio.body().byteStream();
                     java.io.FileOutputStream out =
                         new java.io.FileOutputStream(audioFile)) {
                    byte[] buffer = new byte[8192];
                    int count;

                    while ((count = in.read(buffer)) != -1) {
                        out.write(buffer, 0, count);
                    }
                }
                audio.close();

                final String filePath = audioFile.getAbsolutePath();

                handler.post(() -> {
                    try {
                        if (ttsPlayer != null) {
                            ttsPlayer.release();
                            ttsPlayer = null;
                        }

                        ttsPlayer = new android.media.MediaPlayer();
                        ttsPlayer.setAudioStreamType(
                            AudioManager.STREAM_MUSIC);
                        ttsPlayer.setDataSource(filePath);

                        ttsPlayer.setOnPreparedListener(player -> {
                            tvStatus.setText("Говорю...");
                            player.start();
                        });

                        ttsPlayer.setOnCompletionListener(player -> {
                            player.release();
                            ttsPlayer = null;
                            tvStatus.setText("Нажмите для начала");
                            tvStatus.setTextColor(
                                getColor(R.color.status_idle));
                        });

                        ttsPlayer.setOnErrorListener(
                            (player, what, extra) -> {
                                player.release();
                                ttsPlayer = null;
                                tvStatus.setText("Ошибка воспроизведения");
                                saveError("MediaPlayer: " + what
                                    + ", " + extra);
                                return true;
                            });

                        ttsPlayer.prepareAsync();

                    } catch (Exception e) {
                        saveError("Player: " + e.getMessage());
                        tvStatus.setText("Ошибка воспроизведения");
                    }
                });

            } catch (Exception e) {
                saveError("FreeTTS: " + e.getMessage());
                handler.post(() ->
                    tvStatus.setText(
                        "Ошибка озвучки. Проверь ключ и интернет."));
            }
        });
    }

    @Override
    protected void onDestroy() {
        super.onDestroy();

        try {
            unregisterReceiver(btReceiver);
        } catch (Exception ignored) {
        }

        if (ttsPlayer != null) {
            ttsPlayer.release();
            ttsPlayer = null;
        }

        executor.shutdown();
    }
}
