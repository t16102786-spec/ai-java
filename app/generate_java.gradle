    new File("${src}/java/com/aiassistant/app/MainActivity.java").text = '''package com.aiassistant.app;
import android.Manifest;
import android.bluetooth.BluetoothAdapter;
import android.bluetooth.BluetoothDevice;
import android.bluetooth.BluetoothProfile;
import android.content.BroadcastReceiver;
import android.content.Context;
import android.content.Intent;
import android.content.IntentFilter;
import android.content.SharedPreferences;
import android.content.pm.PackageManager;
import android.media.AudioFormat;
import android.media.AudioManager;
import android.media.AudioRecord;
import android.media.MediaRecorder;
import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;
import android.widget.Button;
import android.widget.TextView;
import android.widget.Toast;
import androidx.appcompat.app.AppCompatActivity;
import androidx.core.app.ActivityCompat;
import okhttp3.*;
import org.json.JSONObject;
import java.io.*;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;
public class MainActivity extends AppCompatActivity {
    private TextView tvStatus, tvTranscript, tvResponse, tvBluetooth;
    private Button btnMic, btnBt;
    private AudioRecord audioRecord;
    private boolean isRecording = false;
    private ExecutorService executor = Executors.newSingleThreadExecutor();
    private Handler handler = new Handler(Looper.getMainLooper());
    private AudioManager audioManager;
    private BluetoothAdapter bluetoothAdapter;
    private static final int SAMPLE_RATE = 16000;
    private static final int CHANNEL = AudioFormat.CHANNEL_IN_MONO;
    private static final int FORMAT = AudioFormat.ENCODING_PCM_16BIT;
    private BroadcastReceiver btReceiver = new BroadcastReceiver() {
        @Override public void onReceive(Context context, Intent intent) { checkBluetooth(); }
    };
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        tvStatus = findViewById(R.id.tvStatus);
        tvTranscript = findViewById(R.id.tvTranscript);
        tvResponse = findViewById(R.id.tvResponse);
        tvBluetooth = findViewById(R.id.tvBluetooth);
        btnMic = findViewById(R.id.btnMic);
        btnBt = findViewById(R.id.btnBt);
        audioManager = (AudioManager) getSystemService(AUDIO_SERVICE);
        bluetoothAdapter = BluetoothAdapter.getDefaultAdapter();
        IntentFilter filter = new IntentFilter();
        filter.addAction(BluetoothDevice.ACTION_ACL_CONNECTED);
        filter.addAction(BluetoothDevice.ACTION_ACL_DISCONNECTED);
        registerReceiver(btReceiver, filter);
        checkBluetooth();
        ActivityCompat.requestPermissions(this,
            new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.BLUETOOTH_CONNECT}, 1);
        btnBt.setOnClickListener(v -> checkBluetooth());
        btnMic.setOnClickListener(v -> { if (!isRecording) startRecording(); else stopRecording(); });
        findViewById(R.id.fabSettings).setOnClickListener(v ->
            startActivity(new Intent(this, SettingsActivity.class)));
    }
    private void checkBluetooth() {
        if (bluetoothAdapter == null || !bluetoothAdapter.isEnabled()) {
            tvBluetooth.setText("🔇 Bluetooth выключен"); return;
        }
        if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT)
                != PackageManager.PERMISSION_GRANTED) {
            tvBluetooth.setText("🔇 Нет разрешения"); return;
        }
        tvBluetooth.setText("🔍 Поиск...");
        bluetoothAdapter.getProfileProxy(this, new BluetoothProfile.ServiceListener() {
            @Override public void onServiceConnected(int profile, BluetoothProfile proxy) {
                java.util.List<BluetoothDevice> devices = proxy.getConnectedDevices();
                if (!devices.isEmpty()) {
                    BluetoothDevice d = devices.get(0);
                    handler.post(() -> tvBluetooth.setText("🎧 " + d.getName()));
                } else {
                    handler.post(() -> tvBluetooth.setText("🔇 Не подключены"));
                }
                bluetoothAdapter.closeProfileProxy(profile, proxy);
            }
            @Override public void onServiceDisconnected(int profile) {}
        }, BluetoothProfile.HEADSET);
    }
