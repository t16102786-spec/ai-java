buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.3.0' }
}
apply plugin: 'com.android.application'
android {
    namespace 'com.aiassistant.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.aiassistant.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20240303'
}
apply from: 'generate_resources.gradle'
apply from: 'generate_layout.gradle'
apply from: 'generate_settings.gradle'
apply from: 'generate_main1.gradle'
apply from: 'generate_main2.gradle'
preBuild.dependsOn generateSources
