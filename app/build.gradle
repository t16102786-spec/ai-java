// ════════════════════════════════════════════════════════════
//  AI Помощник — весь проект в одном файле
//  Gradle сам создаёт папки и файлы перед сборкой
// ════════════════════════════════════════════════════════════
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
    }
}
apply plugin: 'com.android.application'

android {
    namespace 'com.aiassistant'
    compileSdk 34
    defaultConfig {
        applicationId 'com.aiassistant'
        minSdk 26; targetSdk 34
        versionCode 1; versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
}

// ── Генерация исходников ──────────────────────────────────
def src   = 'app/src/main'
def java  = "$src/java/com/aiassistant"
def res   = "$src/res"

task generateSources {
    doLast {
        // ── AndroidManifest ──────────────────────────────
        file("$src/AndroidManifest.xml").parentFile.mkdirs()
        file("$src/AndroidManifest.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aiassistant">
  <uses-permission android:name="android.permission.INTERNET"/>
  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
  <uses-permission android:name="android.permission.RECORD_AUDIO"/>
  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
  <uses-permission android:name="android.permission.BLUETOOTH"/>
  <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
  <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
  <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
  <application android:allowBackup="false" android:label="AI Помощник"
      android:theme="@style/Theme.AIAssistant" android:supportsRtl="true">
    <activity android:name=".MainActivity" android:exported="true"
        android:windowSoftInputMode="adjustResize">
      <intent-filter>
        <action android:name="android.intent.action.MAIN"/>
