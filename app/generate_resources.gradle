task generateSources {
    doLast {
        def root = project.rootDir.absolutePath
        def src = "${root}/app/src/main"

        ["${src}/res/values",
         "${src}/res/drawable",
         "${src}/res/mipmap-mdpi",
         "${src}/res/mipmap-hdpi",
         "${src}/res/mipmap-xhdpi",
         "${src}/res/mipmap-xxhdpi",
         "${src}/res/layout"].each { new File(it).mkdirs() }

        new File("${src}/AndroidManifest.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.BLUETOOTH"/>
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:theme="@style/AppTheme">
        <activity android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
        <activity android:name=".SettingsActivity"
            android:exported="false"/>
    </application>
</manifest>'''

        new File("${src}/res/values/colors.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="purple_200">#FFBB86FC</color>
    <color name="purple_500">#FF6200EE</color>
    <color name="purple_700">#FF3700B3</color>
    <color name="teal_200">#FF03DAC5</color>
    <color name="black">#FF000000</color>
    <color name="white">#FFFFFFFF</color>
</resources>'''

        new File("${src}/res/values/strings.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">AI Assistant</string>
</resources>'''

        new File("${src}/res/values/themes.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
        <item name="colorPrimary">@color/purple_500</item>
        <item name="colorPrimaryDark">@color/purple_700</item>
        <item name="colorAccent">@color/teal_200</item>
    </style>
</resources>'''

        new File("${src}/res/drawable/mic_button_bg.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<selector xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:state_pressed="true">
        <shape android:shape="oval">
            <solid android:color="#FF3700B3"/>
            <size android:width="80dp" android:height="80dp"/>
        </shape>
    </item>
    <item>
        <shape android:shape="oval">
            <solid android:color="#FF6200EE"/>
            <size android:width="80dp" android:height="80dp"/>
        </shape>
    </item>
</selector>'''

        def pngBytes = [0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A,
                        0x00,0x00,0x00,0x0D,0x49,0x48,0x44,0x52,
                        0x00,0x00,0x00,0x30,0x00,0x00,0x00,0x30,
                        0x08,0x02,0x00,0x00,0x00,0xB3,0x52,0x82,
                        0x0C,0x00,0x00,0x00,0x12,0x49,0x44,0x41,
                        0x54,0x78,0x9C,0x62,0xF8,0x8F,0x80,0x11,
                        0x18,0x00,0x00,0x00,0xFF,0xFF,0x03,0x00,
                        0x18,0x0A,0x00,0x01,0xE1,0xF4,0x5C,0x71,
                        0x00,0x00,0x00,0x00,0x49,0x45,0x4E,0x44,
                        0xAE,0x42,0x60,0x82] as byte[]

        ["mipmap-mdpi","mipmap-hdpi","mipmap-xhdpi","mipmap-xxhdpi"].each {
            new File("${src}/res/${it}/ic_launcher.png")
                .withOutputStream { os -> os.write(pngBytes) }
        }
    }
}
