def root = project.rootDir.absolutePath
def src = "${root}/app/src/main"
task generateSources {
    doLast {
        new File("${src}").mkdirs()
        new File("${src}/AndroidManifest.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.BLUETOOTH"/>
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
    <application
        android:allowBackup="true"
        android:icon="@mipmap/ic_launcher"
        android:label="@string/app_name"
        android:theme="@style/Theme.AIAssistant">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
        <activity android:name=".SettingsActivity" android:exported="false"/>
    </application>
</manifest>'''
        new File("${src}/res/values").mkdirs()
        new File("${src}/res/values/colors.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="purple_500">#FF6200EE</color>
    <color name="purple_700">#FF3700B3</color>
    <color name="white">#FFFFFFFF</color>
    <color name="bg_dark">#FF121212</color>
    <color name="accent">#FF6200EE</color>
    <color name="text_primary">#FFFFFFFF</color>
    <color name="text_secondary">#FFB3B3B3</color>
    <color name="status_idle">#FF757575</color>
    <color name="status_listening">#FF4CAF50</color>
    <color name="status_processing">#FFFFC107</color>
    <color name="status_speaking">#FF2196F3</color>
</resources>'''
        new File("${src}/res/values/strings.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">AI Ассистент</string>
    <string name="status_idle">Нажмите для начала</string>
    <string name="status_listening">Слушаю...</string>
    <string name="status_processing">Обрабатываю...</string>
    <string name="status_speaking">Говорю...</string>
    <string name="no_keys">Сначала укажите API ключи в настройках</string>
    <string name="bluetooth_none">Наушники не найдены</string>
</resources>'''
        new File("${src}/res/values/themes.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="Theme.AIAssistant" parent="Theme.MaterialComponents.DayNight.NoActionBar">
        <item name="colorPrimary">@color/purple_500</item>
        <item name="colorPrimaryVariant">@color/purple_700</item>
        <item name="colorOnPrimary">@color/white</item>
        <item name="android:windowBackground">@color/bg_dark</item>
    </style>
</resources>'''
        new File("${src}/res/drawable").mkdirs()
        new File("${src}/res/drawable/mic_button_bg.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<selector xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:state_pressed="true">
        <shape android:shape="oval">
            <solid android:color="#FF3700B3"/>
            <size android:width="120dp" android:height="120dp"/>
        </shape>
    </item>
    <item>
        <shape android:shape="oval">
            <solid android:color="#FF6200EE"/>
            <size android:width="120dp" android:height="120dp"/>
        </shape>
    </item>
</selector>'''
        new File("${src}/res/layout").mkdirs()
        new File("${src}/res/layout/activity_main.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<androidx.constraintlayout.widget.ConstraintLayout
    xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:app="http://schemas.android.com/apk/res-auto"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="@color/bg_dark">
    <TextView android:id="@+id/tvTitle"
        android:layout_width="wrap_content" android:layout_height="wrap_content"
        android:text="AI Ассистент" android:textColor="@color/text_primary"
        android:textSize="24sp" android:textStyle="bold"
        app:layout_constraintTop_toTopOf="parent"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        android:layout_marginTop="48dp"/>
    <TextView android:id="@+id/tvBluetooth"
        android:layout_width="wrap_content" android:layout_height="wrap_content"
        android:text="Наушники не найдены" android:textColor="@color/text_secondary"
        android:textSize="14sp"
        app:layout_constraintTop_toBottomOf="@id/tvTitle"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        android:layout_marginTop="8dp"/>
    <TextView android:id="@+id/tvStatus"
        android:layout_width="wrap_content" android:layout_height="wrap_content"
        android:text="Нажмите для начала" android:textColor="@color/status_idle"
        android:textSize="18sp"
        app:layout_constraintTop_toBottomOf="@id/tvBluetooth"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        android:layout_marginTop="32dp"/>
    <Button android:id="@+id/btnMic"
        android:layout_width="120dp" android:layout_height="120dp"
        android:background="@drawable/mic_button_bg"
        android:text="🎤" android:textSize="36sp"
        app:layout_constraintTop_toBottomOf="@id/tvStatus"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        android:layout_marginTop="48dp"/>
    <TextView android:id="@+id/tvTranscript"
        android:layout_width="0dp" android:layout_height="wrap_content"
        android:text="" android:textColor="@color/text_secondary"
        android:textSize="14sp" android:padding="16dp" android:gravity="center"
        app:layout_constraintTop_toBottomOf="@id/btnMic"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent"
        android:layout_marginTop="24dp"/>
    <TextView android:id="@+id/tvResponse"
        android:layout_width="0dp" android:layout_height="wrap_content"
        android:text="" android:textColor="@color/text_primary"
        android:textSize="16sp" android:padding="16dp" android:gravity="center"
        app:layout_constraintTop_toBottomOf="@id/tvTranscript"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent"/>
    <com.google.android.material.floatingactionbutton.FloatingActionButton
        android:id="@+id/fabSettings"
        android:layout_width="wrap_content" android:layout_height="wrap_content"
        android:src="@android:drawable/ic_menu_preferences"
        android:layout_margin="16dp"
        app:layout_constraintBottom_toBottomOf="parent"
        app:layout_constraintEnd_toEndOf="parent"/>
</androidx.constraintlayout.widget.ConstraintLayout>'''
        new File("${src}/res/layout/activity_settings.xml").text = '''<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent" android:layout_height="match_parent"
    android:orientation="vertical" android:background="@color/bg_dark" android:padding="24dp">
    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
        android:text="Настройки" android:textColor="@color/text_primary"
        android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="24dp"/>
    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
        android:text="AssemblyAI API ключ:" android:textColor="@color/text_secondary"/>
    <EditText android:id="@+id/etAssemblyKey"
        android:layout_width="match_parent" android:layout_height="wrap_content"
        android:hint="Вставьте ключ" android:textColor="@color/text_primary"
        android:inputType="textPassword" android:layout_marginBottom="24dp"/>
    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
        android:text="Groq API ключ:" android:textColor="@color/text_secondary"/>
    <EditText android:id="@+id/etGroqKey"
        android:layout_width="match_parent" android:layout_height="wrap_content"
        android:hint="Вставьте ключ" android:textColor="@color/text_primary"
        android:inputType="textPassword" android:layout_marginBottom="32dp"/>
    <Button android:id="@+id/btnSave"
        android:layout_width="match_parent" android:layout_height="wrap_content"
        android:text="Сохранить" android:backgroundTint="@color/accent"/>
</LinearLayout>'''
        new File("${src}/res/mipmap-hdpi").mkdirs()
        new File("${src}/res/mipmap-mdpi").mkdirs()
        new File("${src}/res/mipmap-xhdpi").mkdirs()
        new File("${src}/res/mipmap-xxhdpi").mkdirs()
    }
}
