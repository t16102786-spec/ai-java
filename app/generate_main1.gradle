generateSources.doLast {
    new File("${src}/java/com/aiassistant/app/MainActivity.java").text = '''package com.aiassistant.app;
import android.Manifest;
import android.bluetooth.BluetoothAdapter;
import android.bluetooth.BluetoothDevice;
import android.bluetooth.BluetoothProfile;
import android.content.BroadcastReceiver;
import android.content.Context;
import android.content.Intent;
import android.content.IntentFilter;
import android.content.SharedPreferences;
import android.content.pm.PackageManager;
import android.media.AudioFormat;
import android.media.AudioManager;
import android.media.AudioRecord;
import android.media.MediaRecorder;
import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;
import android.widget.Button;
import android.widget.TextView;
import android.widget.Toast;
import androidx.appcompat.app.AppCompatActivity;
import androidx.core.app.ActivityCompat;
import okhttp3.*;
import org.json.JSONObject;
import java.io.*;
import java.util.concurrent.ExecutorService;
import java.util.concurrent.Executors;
public class MainActivity extends AppCompatActivity {
    private TextView tvStatus, tvTranscript, tvResponse, tvBluetooth;
    private Button btnMic, btnBt;
    private AudioRecord audioRecord;
    private boolean isRecording = false;
    private ExecutorService executor = Executors.newSingleThreadExecutor();
    private Handler handler = new Handler(Looper.getMainLooper());
    private AudioManager audioManager;
    private BluetoothAdapter bluetoothAdapter;
    private static final int SAMPLE_RATE = 16000;
    private static final int CHANNEL = AudioFormat.CHANNEL_IN_MONO;
    private static final int FORMAT = AudioFormat.ENCODING_PCM_16BIT;
    private BroadcastReceiver btReceiver = new BroadcastReceiver() {
        @Override public void onReceive(Context context, Intent intent) { checkBluetooth(); }
    };
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        tvStatus = findViewById(R.id.tvStatus);
        tvTranscript = findViewById(R.id.tvTranscript);
        tvResponse = findViewById(R.id.tvResponse);
        tvBluetooth = findViewById(R.id.tvBluetooth);
        btnMic = findViewById(R.id.btnMic);
        btnBt = findViewById(R.id.btnBt);
        audioManager = (AudioManager) getSystemService(AUDIO_SERVICE);
        bluetoothAdapter = BluetoothAdapter.getDefaultAdapter();
        IntentFilter filter = new IntentFilter();
        filter.addAction(BluetoothDevice.ACTION_ACL_CONNECTED);
        filter.addAction(BluetoothDevice.ACTION_ACL_DISCONNECTED);
        registerReceiver(btReceiver, filter);
        checkBluetooth();
        ActivityCompat.requestPermissions(this,
            new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.BLUETOOTH_CONNECT}, 1);
        btnBt.setOnClickListener(v -> checkBluetooth());
        btnMic.setOnClickListener(v -> { if (!isRecording) startRecording(); else stopRecording(); });
        findViewById(R.id.fabSettings).setOnClickListener(v ->
            startActivity(new Intent(this, SettingsActivity.class)));
    }
    private void checkBluetooth() {
        if (bluetoothAdapter == null || !bluetoothAdapter.isEnabled()) {
            tvBluetooth.setText("🔇 Bluetooth выключен"); return;
        }
        if (ActivityCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT)
                != PackageManager.PERMISSION_GRANTED) {
            tvBluetooth.setText("🔇 Нет разрешения"); return;
        }
        tvBluetooth.setText("🔍 Поиск...");
        bluetoothAdapter.getProfileProxy(this, new BluetoothProfile.ServiceListener() {
            @Override public void onServiceConnected(int profile, BluetoothProfile proxy) {
                java.util.List<BluetoothDevice> devices = proxy.getConnectedDevices();
                if (!devices.isEmpty()) {
                    handler.post(() -> tvBluetooth.setText("🎧 " + devices.get(0).getName()));
                } else {
                    handler.post(() -> tvBluetooth.setText("🔇 Не подключены"));
                }
                bluetoothAdapter.closeProfileProxy(profile, proxy);
            }
            @Override public void onServiceDisconnected(int profile) {}
        }, BluetoothProfile.HEADSET);
    }
    private void startRecording() {
        SharedPreferences prefs = getSharedPreferences("ai_prefs", MODE_PRIVATE);
        String aKey = prefs.getString("assembly_key", "");
        String gKey = prefs.getString("groq_key", "");
        if (aKey.isEmpty() || gKey.isEmpty()) {
            Toast.makeText(this, "Укажите API ключи в настройках", Toast.LENGTH_LONG).show();
            startActivity(new Intent(this, SettingsActivity.class)); return;
        }
        if (ActivityCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                != PackageManager.PERMISSION_GRANTED) {
            ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 1); return;
        }
        int bufSize = AudioRecord.getMinBufferSize(SAMPLE_RATE, CHANNEL, FORMAT);
        audioRecord = new AudioRecord(MediaRecorder.AudioSource.MIC, SAMPLE_RATE, CHANNEL, FORMAT, bufSize * 4);
        if (audioRecord.getState() != AudioRecord.STATE_INITIALIZED) {
            saveError("AudioRecord не инициализирован"); return;
        }
        audioRecord.startRecording();
        isRecording = true;
        btnMic.setText("⏹");
        tvStatus.setText("Слушаю...");
        tvStatus.setTextColor(getColor(R.color.status_listening));
        executor.execute(() -> {
            ByteArrayOutputStream baos = new ByteArrayOutputStream();
            byte[] buf = new byte[bufSize];
            while (isRecording) { int r = audioRecord.read(buf,0,buf.length); if(r>0) baos.write(buf,0,r); }
            handler.post(() -> { tvStatus.setText("Обрабатываю..."); tvStatus.setTextColor(getColor(R.color.status_processing)); });
            transcribeAndRespond(pcmToWav(baos.toByteArray()), aKey, gKey);
        });
    }
    private void stopRecording() {
        isRecording = false; btnMic.setText("🎤");
        if (audioRecord != null) { audioRecord.stop(); audioRecord.release(); audioRecord = null; }
    }
    private void saveError(String e) {
        getSharedPreferences("ai_prefs",MODE_PRIVATE).edit().putString("last_error",e).apply();
    }
    private byte[] pcmToWav(byte[] pcm) {
        int dl=pcm.length, tl=dl+44; byte[] w=new byte[tl];
        w[0]=\'R\';w[1]=\'I\';w[2]=\'F\';w[3]=\'F\'; intB(tl-8,w,4);
        w[8]=\'W\';w[9]=\'A\';w[10]=\'V\';w[11]=\'E\';
        w[12]=\'f\';w[13]=\'m\';w[14]=\'t\';w[15]=\' \'; intB(16,w,16);
        w[20]=1;w[22]=1; intB(SAMPLE_RATE,w,24); intB(SAMPLE_RATE*2,w,28);
        w[32]=2;w[34]=16;
        w[36]=\'d\';w[37]=\'a\';w[38]=\'t\';w[39]=\'a\'; intB(dl,w,40);
        System.arraycopy(pcm,0,w,44,dl); return w;
    }
    private void intB(int v,byte[]b,int o){b[o]=(byte)v;b[o+1]=(byte)(v>>8);b[o+2]=(byte)(v>>16);b[o+3]=(byte)(v>>24);}
'''
}
