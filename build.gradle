        // ── Java ─────────────────────────────────────────
        file("$java").mkdirs()
        file("$java/MainActivity.java").text = """package com.aiassistant;
import android.Manifest;
import android.content.Intent;
import android.content.SharedPreferences;
import android.content.pm.PackageManager;
import android.media.AudioFormat;
import android.media.AudioManager;
import android.media.AudioRecord;
import android.media.MediaRecorder;
import android.os.Build;
import android.os.Bundle;
import android.os.Handler;
import android.os.Looper;
import android.speech.tts.TextToSpeech;
import android.view.View;
import android.widget.ImageButton;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import org.json.JSONArray;
import org.json.JSONObject;
import java.io.*;
import java.net.HttpURLConnection;
import java.net.URL;
import java.nio.ByteBuffer;
import java.nio.ByteOrder;
import java.util.ArrayList;
import java.util.List;
import java.util.Locale;

public class MainActivity extends AppCompatActivity implements TextToSpeech.OnInitListener {
    private TextView tvStatus, tvLog;
    private ImageButton btnMic, btnSettings;
    private View[] vizBars = new View[12];
    private TextToSpeech tts;
    private boolean ttsReady = false;
    private AudioRecord audioRecord;
    private boolean isRecording = false, isBusy = false;
    private ByteArrayOutputStream audioBuffer;
    private static final int SAMPLE_RATE = 16000;
    private SharedPreferences prefs;
    private String groqKey, asmKey, wakeWord, systemPrompt, model;
    private final Handler handler = new Handler(Looper.getMainLooper());

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        prefs = getSharedPreferences("ai_prefs", MODE_PRIVATE);
        loadSettings();
        tvStatus   = findViewById(R.id.tvStatus);
        tvLog      = findViewById(R.id.tvLog);
        btnMic     = findViewById(R.id.btnMic);
        btnSettings = findViewById(R.id.btnSettings);
        int[] ids = {R.id.b1,R.id.b2,R.id.b3,R.id.b4,R.id.b5,R.id.b6,
                     R.id.b7,R.id.b8,R.id.b9,R.id.b10,R.id.b11,R.id.b12};
        for (int i=0;i<ids.length;i++) vizBars[i]=findViewById(ids[i]);
        tts = new TextToSpeech(this, this);
        AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
        am.requestAudioFocus(null, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
        btnMic.setOnClickListener(v -> toggleRecord());
        btnSettings.setOnClickListener(v -> startActivityForResult(new Intent(this, SettingsActivity.class), 2));
        requestPerms();
        checkBanner();
    }

    private void loadSettings() {
        groqKey      = prefs.getString("groq", "");
        asmKey       = prefs.getString("asm", "");
        wakeWord     = prefs.getString("wake", "ассистент").toLowerCase();
        systemPrompt = prefs.getString("prompt", "Ты голосовой помощник. Отвечай кратко — 1-2 предложения.");
        model        = prefs.getString("model", "llama3-8b-8192");
    }

    @Override protected void onActivityResult(int req, int res, Intent data) {
        super.onActivityResult(req,res,data); loadSettings(); checkBanner();
    }

    private void requestPerms() {
        List<String> need = new ArrayList<>();
        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
            need.add(Manifest.permission.RECORD_AUDIO);
        if (Build.VERSION.SDK_INT >= 31 &&
            ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED)
            need.add(Manifest.permission.BLUETOOTH_CONNECT);
        if (!need.isEmpty()) ActivityCompat.requestPermissions(this, need.toArray(new String[0]), 1);
    }

    private void checkBanner() {
        if (groqKey.isEmpty() || asmKey.isEmpty())
            setStatus("⚙ Нажми настройки — добавь API ключи", "warn");
        else setStatus("Нажми 🎤 и говори", "idle");
    }

    private void toggleRecord() {
        if (isBusy) return;
        if (isRecording) stopRec(); else startRec();
    }

    private void startRec() {
        if (groqKey.isEmpty() || asmKey.isEmpty()) { setStatus("⚙ Добавь API ключи", "err"); return; }
        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
            setStatus("❌ Нет разрешения на микрофон", "err"); requestPerms(); return;
        }
        int buf = AudioRecord.getMinBufferSize(SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
        audioRecord = new AudioRecord(MediaRecorder.AudioSource.MIC, SAMPLE_RATE,
            AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, buf*4);
        audioBuffer = new ByteArrayOutputStream();
        audioRecord.startRecording();
        isRecording = true;
        btnMic.setImageResource(R.drawable.ic_stop);
        btnMic.setBackgroundTintList(getColorStateList(R.color.red));
        setStatus("🎤 Записываю... говори!", "active");
        startViz();
        new Thread(() -> {
            byte[] b = new byte[buf];
            while (isRecording) { int n=audioRecord.read(b,0,b.length); if(n>0) audioBuffer.write(b,0,n); }
        }).start();
    }

    private void stopRec() {
        isRecording = false; isBusy = true; stopViz();
        if (audioRecord!=null) { audioRecord.stop(); audioRecord.release(); audioRecord=null; }
        btnMic.setImageResource(R.drawable.ic_mic);
        btnMic.setBackgroundTintList(getColorStateList(R.color.accent));
        btnMic.setEnabled(false);
        setStatus("⏳ Распознаю речь...", "active");
        byte[] wav = pcmToWav(audioBuffer.toByteArray(), SAMPLE_RATE, 1, 16);
        new Thread(() -> process(wav)).start();
    }

    private void process(byte[] wav) {
        try {
            String text = stt(wav);
            if (text==null||text.isEmpty()) { uiStatus("Не разобрал речь","warn"); resetBtn(); return; }
            String low = text.toLowerCase();
            if (!wakeWord.isEmpty() && !low.contains(wakeWord)) { uiStatus("Слышу: "+text,"idle"); resetBtn(); return; }
            String query = wakeWord.isEmpty() ? text : text.replaceAll("(?i)"+wakeWord,"").trim();
            if (query.isEmpty()) { uiStatus("Скажи запрос после кодового слова","warn"); resetBtn(); return; }
            uiLog("👤 "+query, true);
            uiStatus("🤔 Думаю...", "active");
            String ans = llm(query);
            if (ans==null||ans.isEmpty()) { resetBtn(); return; }
            uiLog("🤖 "+ans, false);
            uiStatus("🔊 Говорю...", "ok");
            handler.post(() -> speak(ans));
        } catch(Exception e) { uiStatus("❌ "+e.getMessage(),"err"); resetBtn(); }
    }

    private String stt(byte[] wav) throws Exception {
        uiStatus("⬆️ Отправляю аудио...","active");
        HttpURLConnection c = (HttpURLConnection) new URL("https://api.assemblyai.com/v2/upload").openConnection();
        c.setRequestMethod("POST");
        c.setRequestProperty("authorization", asmKey);
        c.setRequestProperty("content-type","application/octet-stream");
        c.setDoOutput(true);
        c.getOutputStream().write(wav);
        String up = stream(c.getInputStream()); c.disconnect();
        String uploadUrl = new JSONObject(up).getString("upload_url");
        uiStatus("🧠 Распознаю...","active");
        HttpURLConnection tc = (HttpURLConnection) new URL("https://api.assemblyai.com/v2/transcript").openConnection();
        tc.setRequestMethod("POST");
        tc.setRequestProperty("authorization",asmKey);
        tc.setRequestProperty("content-type","application/json");
        tc.setDoOutput(true);
        JSONObject b = new JSONObject(); b.put("audio_url",uploadUrl); b.put("language_code","ru");
        tc.getOutputStream().write(b.toString().getBytes("UTF-8"));
        String id = new JSONObject(stream(tc.getInputStream())).getString("id"); tc.disconnect();
        for (int i=0;i<30;i++) {
            Thread.sleep(1500);
            HttpURLConnection pc = (HttpURLConnection) new URL("https://api.assemblyai.com/v2/transcript/"+id).openConnection();
            pc.setRequestProperty("authorization",asmKey);
            JSONObject d = new JSONObject(stream(pc.getInputStream())); pc.disconnect();
            String st = d.getString("status");
            if ("completed".equals(st)) return d.optString("text","");
            if ("error".equals(st)) throw new Exception("AssemblyAI: "+d.optString("error"));
        }
        throw new Exception("Таймаут");
    }

    private String llm(String q) throws Exception {
        HttpURLConnection c = (HttpURLConnection) new URL("https://api.groq.com/openai/v1/chat/completions").openConnection();
        c.setRequestMethod("POST");
        c.setRequestProperty("content-type","application/json");
        c.setRequestProperty("authorization","Bearer "+groqKey);
        c.setDoOutput(true);
        JSONObject req = new JSONObject(); req.put("model",model); req.put("max_tokens",150); req.put("temperature",0.7);
        JSONArray msgs = new JSONArray();
        JSONObject s = new JSONObject(); s.put("role","system"); s.put("content",systemPrompt); msgs.put(s);
        JSONObject u = new JSONObject(); u.put("role","user"); u.put("content",q); msgs.put(u);
        req.put("messages",msgs);
        c.getOutputStream().write(req.toString().getBytes("UTF-8"));
        int code = c.getResponseCode();
        if (code==401) { uiStatus("❌ Неверный Groq ключ","err"); return null; }
        if (code==429) { uiStatus("⏳ Groq: лимит запросов","warn"); return null; }
        String res = stream(c.getInputStream()); c.disconnect();
        return new JSONObject(res).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content").trim();
    }

    @Override public void onInit(int st) {
        if (st==TextToSpeech.SUCCESS) {
            int r = tts.setLanguage(new Locale("ru","RU"));
            ttsReady = r!=TextToSpeech.LANG_MISSING_DATA && r!=TextToSpeech.LANG_NOT_SUPPORTED;
        }
    }

    private void speak(String text) {
        if (ttsReady) {
            tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "ai");
            handler.postDelayed(() -> { setStatus("✅ Готово","ok"); resetBtn(); }, text.length()*60L);
        } else { setStatus("⚠ TTS недоступен","warn"); resetBtn(); }
    }

    private boolean vizRunning;
    private void startViz() {
        vizRunning = true;
        new Thread(() -> {
            int step=0;
            while (vizRunning) {
                int[] h = new int[12];
                for (int i=0;i<12;i++) h[i]=(int)(8+20*Math.abs(Math.sin((i+step)*0.5)));
                step++;
                int[] fh=h;
                handler.post(() -> { for(int i=0;i<vizBars.length;i++) {
                    vizBars[i].getLayoutParams().height=(int)(fh[i]*getResources().getDisplayMetrics().density);
                    vizBars[i].requestLayout(); }});
                try { Thread.sleep(80); } catch(Exception ignored){}
            }
        }).start();
    }
    private void stopViz() {
        vizRunning=false;
        handler.post(() -> { for(View v:vizBars){ v.getLayoutParams().height=(int)(4*getResources().getDisplayMetrics().density); v.requestLayout(); }});
    }

    private byte[] pcmToWav(byte[] pcm, int sr, int ch, int bits) {
        ByteBuffer buf = ByteBuffer.allocate(44+pcm.length).order(ByteOrder.LITTLE_ENDIAN);
        int br=sr*ch*bits/8;
        buf.put("RIFF".getBytes()); buf.putInt(36+pcm.length); buf.put("WAVE".getBytes());
        buf.put("fmt ".getBytes()); buf.putInt(16); buf.putShort((short)1);
        buf.putShort((short)ch); buf.putInt(sr); buf.putInt(br);
        buf.putShort((short)(ch*bits/8)); buf.putShort((short)bits);
        buf.put("data".getBytes()); buf.putInt(pcm.length); buf.put(pcm);
        return buf.array();
    }

    private String stream(InputStream is) throws Exception {
        ByteArrayOutputStream o=new ByteArrayOutputStream(); byte[] b=new byte[4096]; int n;
        while((n=is.read(b))!=-1) o.write(b,0,n); return o.toString("UTF-8");
    }

    private void setStatus(String t, String type) {
        switch(type) {
            case "active": tvStatus.setTextColor(getColor(R.color.accent)); break;
            case "ok":     tvStatus.setTextColor(getColor(R.color.green));  break;
            case "err":    tvStatus.setTextColor(getColor(R.color.red));    break;
            case "warn":   tvStatus.setTextColor(getColor(R.color.yellow)); break;
            default:       tvStatus.setTextColor(getColor(R.color.muted));  break;
        }
        tvStatus.setText(t);
    }
    private void uiStatus(String t, String type) { handler.post(() -> setStatus(t,type)); }
    private void uiLog(String t, boolean user) {
        handler.post(() -> { tvLog.setText(tvLog.getText()+t+"\\n");
            tvLog.setTextColor(user ? getColor(R.color.accent) : getColor(R.color.text)); });
    }
    private void resetBtn() { handler.post(() -> { isBusy=false; btnMic.setEnabled(true);
        btnMic.setImageResource(R.drawable.ic_mic);
        btnMic.setBackgroundTintList(getColorStateList(R.color.accent)); }); }

    @Override protected void onDestroy() { super.onDestroy(); if(tts!=null){tts.stop();tts.shutdown();} vizRunning=false; }
}"""

